services:
  api:
    build: .
    ports: ["127.0.0.1:9000:9000"]
    env_file: .env
    volumes: ["./data:/app/data:ro"]
  frontend:
    build:
      context: .
      args: {INSTALL_EXTRAS: "true"}
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0"]
    ports: ["127.0.0.1:8501:8501"]
    env_file: .env
    environment: {RAG_API_URL: "http://api:9000/ask"}
    depends_on: [api]
    profiles: ["ui"]
  ingest:
    build:
      context: .
      args: {INSTALL_EXTRAS: "true"}
    command: ["python", "-m", "rag.ingest"]
    volumes: ["./data:/app/data:ro", "chroma_data:/app/chroma_db"]
    profiles: ["dense"]
volumes:
  chroma_data:
